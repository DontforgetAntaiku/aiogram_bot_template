[project]
name = "aiogram-bot-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram-dialog>=2.6.0",
    "aiogram[i18n]>=3.27.0",
    "betterlogging>=1.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv==1.1.1",
    "redis==6.2.0",
    "tortoise-orm[asyncpg]>=1.0.0",
    "uvloop; sys_platform != 'win32'",
    "winloop; sys_platform == 'win32'",
]

[tool.tortoise]
tortoise_orm = "app.database.TORTOISE_ORM"

[tool.pytest.ini_options]
asyncio_mode = "auto"
